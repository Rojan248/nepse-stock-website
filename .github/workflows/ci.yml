name: NEPSE Stock Platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/ci.db
      ADMIN_API_KEY: ci-admin-key-0123456789abcdef012345
      JWT_SECRET: ci-jwt-secret-0123456789abcdef012345

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend verify
        working-directory: backend
        run: npm run verify

      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Frontend build
        working-directory: frontend
        run: npm run build
